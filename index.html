<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}</style>
<title>Пингвинята на льдине</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: one-screen game, top bar, square-ish board, bottom controls */
:root{--night:#0f2236;--deep:#16324d;--ice:#cfeaf7;--accent:#ff8fab;--gold:#ffd166;--fg:#eef7fc;--muted:#8fb3cc;
--f:'Rubik',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#1d4466,var(--night) 70%);color:var(--fg);font-family:var(--f);margin:0;overflow:hidden;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;box-sizing:border-box;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;font-weight:800;margin:0;letter-spacing:.3px}
.lvl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:100%;border-radius:18px;box-shadow:0 18px 40px #0007}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar button{padding:11px 13px}
button{font:700 15px var(--f);color:var(--fg);background:var(--deep);border:1.5px solid #2e5878;border-radius:14px;padding:12px 16px;cursor:pointer}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#3a1020}
.hint{text-align:center;font-size:13px;color:var(--muted);margin:0}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0f2236cc;border-radius:18px}
.card{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:20px}
.card h2{margin:0;font-size:26px;text-wrap:balance}
.stars{font-size:34px;letter-spacing:6px;color:var(--gold)}
.stars .off{color:#35597a}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.card{max-height:100%;overflow-y:auto}
.grid button{padding:10px 0 8px;width:54px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px}
.grid .mini{font-size:11px;letter-spacing:1px;color:var(--gold);line-height:1;min-height:11px}
.grid .mini .off{color:#35597a}
canvas.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
.stars span{display:inline-block;animation:star .5s cubic-bezier(.3,1.8,.5,1) backwards}
.stars span:nth-child(2){animation-delay:.15s}.stars span:nth-child(3){animation-delay:.3s}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
#sky{position:fixed;inset:0;z-index:-1;pointer-events:none}
@media (prefers-reduced-motion:reduce){canvas.pop,.stars span{animation:none}}
.grid button.done{border-color:var(--gold)}
.grid button:disabled{opacity:.35}
</style>
<canvas id="sky"></canvas><div id="app">
  <header><h1>Пингвинята на льдине</h1><span class="lvl" id="lvl"></span></header>
  <div class="stage"><canvas id="c"></canvas>
    <div class="overlay" id="ov" hidden><div class="card" id="card"></div></div>
  </div>
  <p class="hint" id="hint">Свайп двигает обоих пингвинят сразу. Лёд скользкий!</p>
  <div class="bar">
    <button id="undo">Назад</button><button id="reset">Заново</button><button id="hintb">Подсказка</button><button id="menu">Уровни</button>
  </div>
</div>
<script>
const LEVELS=[["#######", "#A....#", "#.....#", "#.....#", "#.....#", "#.....#", "#.....#", "#.....#", "#.....#", "#.....#", "#....B#", "#######"], ["#######", "#A..#.#", "#.....#", "#.#...#", "#.....#", "#...#.#", "#.....#", "##....#", "#.....#", "#..#..#", "#....B#", "#######"], ["#######", "#A....#", "#.~..##", "#.....#", "#..#..#", "#~....#", "#.....#", "#.#.~.#", "#.....#", "#~....#", "#....B#", "#######"], ["#######", "#A.#..#", "#.....#", "#..S.~#", "#.#...#", "#.....#", "#~..#.#", "#..S..#", "#.#...#", "#....~#", "#.#..B#", "#######"], ["#######", "#A..#.#", "#..~..#", "#.S...#", "##..#.#", "#...S.#", "#.~...#", "#..#..#", "#S....#", "#..#..#", "#....B#", "#######"], ["#######", "#.O...#", "#..#.##", "##..A.#", "##....#", "#.#.#.#", "#...#.#", "#.#.#O#", "#.....#", "#B...##", "##....#", "#######"], ["#######", "#...#.#", "#O....#", "##....#", "#.A...#", "#.#...#", "####.O#", "#.....#", "#.#...#", "#.....#", "#.B.#.#", "#######"], ["#######", "#.#...#", "#..##.#", "#.~.#.#", "#...~B#", "#.#O#.#", "#.....#", "#A#...#", "#..#..#", "#S.#S.#", "#.O...#", "#######"], ["#######", "#..A.##", "#...#.#", "#..##.#", "#.....#", "#v.##.#", "###...#", "#..B.##", "##....#", "#..#..#", "#.....#", "#######"], ["#######", "#.....#", "#.....#", "#B.#.##", "#.#.#.#", "#....##", "#.#..A#", "#..~..#", "#v##~.#", "###.~.#", "#..>#.#", "#######"], ["#######", "#..B..#", "##O#.~#", "#...#.#", "#..#..#", "#.....#", "#....A#", "##~..v#", "#...O##", "#.....#", "#.....#", "#######"], ["#######", "#A....#", "##v...#", "#.#V.##", "##..#.#", "##....#", "#....##", "#...#.#", "#..B#.#", "#..#..#", "#...#.#", "#######"], ["#######", "#BO...#", "##...##", "#....A#", "#....##", "#..#..#", "#...O.#", "#..E..#", "##.#..#", "#.....#", "#..#..#", "#######"], ["#######", "##.#.B#", "#..~~.#", "#..#.O#", "#.#.#.#", "#...V##", "#.....#", "#.....#", "##A...#", "#.O>#.#", "#..E..#", "#######"], ["#######", "##B#..#", "##O##.#", "#....~#", "#.....#", "#..#..#", "#.V..O#", "#...E.#", "#.S~<.#", "#..A.##", "#..#..#", "#######"], ["#######", "#....##", "#SO...#", "#.###A#", "#..#..#", "#S..#.#", "#..#.~#", "##...##", "#^.~B.#", "#...O##", "#...~.#", "#######"], ["#######", "##....#", "#.B<..#", "#.....#", "#.#...#", "###.~.#", "#..V.##", "#..^#.#", "##....#", "#...#.#", "#A.~.##", "#######"], ["#######", "#...#.#", "#.....#", "##..#O#", "##.E..#", "#S...B#", "#..V..#", "#O...##", "#..#..#", "#A...S#", "#...#.#", "#######"], ["#######", "#.#...#", "#.....#", "#O...B#", "##...##", "#.V#..#", "#..#O##", "#~..###", "#.^...#", "##..~.#", "#....A#", "#######"], ["#######", "#.#B..#", "#....S#", "#..##.#", "#V#...#", "##...O#", "#.....#", "#..V..#", "#.~...#", "#O^...#", "#..#~A#", "#######"]];
const BEST=[2, 3, 3, 5, 4, 4, 4, 5, 4, 4, 6, 5, 6, 8, 6, 6, 8, 6, 8, 9];
const HINTS=["Свайпни вверх, а потом влево.", "Ёлочки останавливают скольжение.", "Осторожно: тонкий лёд трескается!", "Снег останавливает пингвина.", "Подумай на пару ходов вперёд.", "Новое! Портал переносит на другой портал.", "Через портал может пройти любой пингвинёнок.", "Порталы, снег и тонкий лёд. Не торопись!", "Новое! Заезжай на трамплин по стрелке и перелети через клетку.", "Трамплин перебросит даже через тонкий лёд.", "Трамплины и порталы. Ищи короткий путь!", "Новое! Морской леопард ходит туда-сюда. Не попадайся ему!", "Леопарды шагают после каждого твоего хода.", "Порталы, трамплины и леопарды.", "Всё сразу: порталы, горки и леопарды.", "Бонус! Тонкий лёд, снег, портал и горка.", "Леопард сторожит горки. Выбери момент!", "Два леопарда и портал. Следи, куда они шагают.", "Почти финал! Думай на несколько ходов вперёд.", "Самый главный уровень. Сможешь на три звезды?"];
const D={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};const RAMP={'>':'R','<':'L','^':'U','v':'D'};const RANG={R:0,D:Math.PI/2,L:Math.PI,U:-Math.PI/2};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let seals=[],portals=[],caughtFx=null,parts=[],intro=0,land=[0,0],shake=0,li=0,grid,pos,hist,moves,anim=null,won=false,t0=performance.now(),hearts=[],fallen=null;
let save={};try{save=JSON.parse(localStorage.getItem('peng')||'{}')}catch(e){}
function store(){try{localStorage.setItem('peng',JSON.stringify(save))}catch(e){}}

function load(i){li=i;grid=LEVELS[i];pos=[];seals=[];portals=[];grid.forEach((r,y)=>[...r].forEach((c,x)=>{if(c==='A')pos[0]=[x,y];if(c==='B')pos[1]=[x,y];if(c==='E')seals.push([x,y,1,0]);if(c==='V')seals.push([x,y,0,1]);if(c==='O')portals.push([x,y])}));caughtFx=null;
hist=[];moves=0;usedHint=false;hintFx=null;won=false;hearts=[];parts=[];fallen=null;anim=null;intro=performance.now();land=[0,0];cv.classList.remove('pop');void cv.offsetWidth;cv.classList.add('pop');document.getElementById('ov').hidden=true;
document.getElementById('hint').textContent=HINTS[i];ui();fit();bake()}
function ui(){document.getElementById('lvl').textContent=`Уровень ${li+1}/${LEVELS.length} · ходы ${moves}`}
function cell(x,y){const c=(grid[y]||'')[x];if(c===undefined)return'#';return 'ABEV'.includes(c)?'.':c}
function sim(p,se,d){const [dx,dy]=D[d],dot=q=>q[0]*dx+q[1]*dy;const ord=dot(p[1])>dot(p[0])?[1,0]:[0,1];
 const np=p.map(q=>q.slice()),paths=[[],[]];let fell=-1,caught=-1;const sealAt=(x,y)=>se.some(s=>s[0]===x&&s[1]===y);
 for(const i of ord){const j=1-i;let [x,y]=np[i],n=0;const pts=paths[i];const occ=(a,b)=>np[j][0]===a&&np[j][1]===b;
  const arrive=(ax,ay,t)=>{x=ax;y=ay;pts.push({x,y,t});if(sealAt(x,y)){caught=i;return'stop'}const c=cell(x,y);
   if(c==='~'){fell=i;return'stop'}
   if(c==='O'){const o=portals.find(q=>q[0]!==x||q[1]!==y);if(o&&!occ(o[0],o[1])){x=o[0];y=o[1];pts.push({x,y,t:'tp'});if(sealAt(x,y)){caught=i;return'stop'}}return'go'}
   if(RAMP[c]){if(RAMP[c]!==d)return'go';const lx=x+dx*2,ly=y+dy*2,lc=cell(lx,ly);if(lc!=='#'&&!occ(lx,ly))return arrive(lx,ly,'j');return'stop'}
   if(c==='S')return'stop';return'go'};
  while(n++<80){const nx=x+dx,ny=y+dy,c=cell(nx,ny);if(c==='#'||occ(nx,ny))break;if(arrive(nx,ny,'s')==='stop')break}
  np[i]=[x,y];if(fell>=0||caught>=0)break}
 const adj=Math.abs(np[0][0]-np[1][0])+Math.abs(np[0][1]-np[1][1])===1;let ns=se.map(s=>s.slice()),sealMoved=false;
 if(fell<0&&caught<0&&!adj&&!(np+''===p+'')){sealMoved=true;
  ns.forEach((s,si)=>{let [x,y,vx,vy]=s;const ok=(a,b)=>{const c=cell(a,b);return(c==='.'||c==='S')&&!ns.some(o=>o!==s&&o[0]===a&&o[1]===b)};if(!ok(x+vx,y+vy)){vx=-vx;vy=-vy}if(ok(x+vx,y+vy)){x+=vx;y+=vy}ns[si]=[x,y,vx,vy]});
  ns.forEach(s=>np.forEach((q,i)=>{if(q[0]===s[0]&&q[1]===s[1]&&caught<0)caught=i}))}
 return{np,paths,fell,caught,seals:ns,sealMoved,win:adj&&fell<0&&caught<0}}
const COST={s:1,j:2,tp:.7};
function move(d){if(anim||won||fallen||caughtFx)return;const res=sim(pos,seals,d);if(res.np+''===pos+''&&res.caught<0)return;
 hist.push({pos:pos.map(q=>q.slice()),seals:seals.map(q=>q.slice())});moves++;ui();buzz(10);
 const tot=Math.max(1,...res.paths.map(p=>p.reduce((a,q)=>a+COST[q.t],0)));
 anim={from:pos,res,s0:seals,t:performance.now(),dur:140+tot*75,tot,dir:d,to:res.np,fell:res.fell};pos=res.np;seals=res.seals;
 if(res.sealMoved)anim.sealT=anim.dur;}
function samplePath(i,u){const a=anim;let x=a.from[i][0],y=a.from[i][1],used=0;const o={x,y,sc:1,hop:0,moving:false};
 for(const q of a.res.paths[i]){const c=COST[q.t];if(u<used+c){const f=(u-used)/c;o.moving=true;
   if(q.t==='tp'){o.x=f<.5?x:q.x;o.y=f<.5?y:q.y;o.sc=Math.abs(1-2*f);o.spin=f*6;return o}
   o.x=x+(q.x-x)*f;o.y=y+(q.y-y)*f;if(q.t==='j')o.hop=Math.sin(f*Math.PI)*1.1;return o}
  used+=c;x=q.x;y=q.y}o.x=x;o.y=y;return o}
function restore(){const h=hist.pop();pos=h.pos;seals=h.seals;moves--;ui()}
function finish(){const a=anim;anim=null;const now=performance.now();
[0,1].forEach(i=>{if(!a.res.paths[i].length||a.fell===i||a.res.caught===i)return;land[i]=now;const [dx,dy]=D[a.dir];
 puff(a.to[i][0]+.5+dx*.35,a.to[i][1]+.8,10,'#ffffff');
 const c=cell(a.to[i][0]+dx,a.to[i][1]+dy);if(c==='#'){shake=now;puff(a.to[i][0]+.5+dx*.5,a.to[i][1]+.5,8,'#cfe3f2')}});
if(a.fell>=0){fallen={i:a.fell,t:now,x:a.to[a.fell][0],y:a.to[a.fell][1]};buzz([15,30,15,30,60]);setTimeout(()=>{splash(fallen.x+.5,fallen.y+.5);shake=performance.now()},520);setTimeout(()=>{restore();fallen=null},1500);return}
if(a.res.caught>=0){const i=a.res.caught;caughtFx={i,t:now};shake=now;buzz([60,40,60]);puff(a.to[i][0]+.5,a.to[i][1]+.5,16,'#ffd166');setTimeout(()=>{restore();caughtFx=null},1100);return}
if(a.res.win){won=true;buzz([20,60,40]);
confetti();for(let k=0;k<18;k++)hearts.push({x:(pos[0][0]+pos[1][0])/2+.5,y:(pos[0][1]+pos[1][1])/2+.3,vx:(Math.random()-.5)*.04,vy:-.02-Math.random()*.03,t:now+k*60});
const st=usedHint?Math.min(2,moves<=BEST[li]+2?2:1):moves<=BEST[li]?3:moves<=BEST[li]+2?2:1;save[li]=Math.max(save[li]||0,st);store();setTimeout(()=>winCard(st),1300)}}
function puff(x,y,n,col){for(let k=0;k<n;k++){const a=Math.random()*6.28,v=.01+Math.random()*.03;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.01,g:.0008,life:500+Math.random()*400,t:performance.now(),r:.04+Math.random()*.05,col,kind:'dot'})}}
function splash(x,y){for(let k=0;k<22;k++){const a=-Math.PI*Math.random(),v=.02+Math.random()*.04;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.002,life:800,t:performance.now(),r:.04+Math.random()*.04,col:Math.random()<.5?'#8fd3f6':'#ffffff',kind:'dot'})}}
function confetti(){const cols=['#ff8fab','#ffd166','#4cc9f0','#b8f2e6','#ffffff','#c3a6ff'];const w=grid[0].length;for(let k=0;k<70;k++)parts.push({x:Math.random()*w,y:-Math.random()*3,vx:(Math.random()-.5)*.02,vy:.03+Math.random()*.04,g:.0004,life:3000,t:performance.now()+Math.random()*500,r:.08+Math.random()*.06,col:cols[k%6],kind:'conf',rot:Math.random()*6,vr:(Math.random()-.5)*.3})}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

function winCard(st){const last=li===LEVELS.length-1;
document.getElementById('card').innerHTML=`<h2>${last?'Вы прошли все уровни!':'Обнимашки!'}</h2>
<div class="stars">${[0,1,2].map(k=>`<span class="${k<st?'':'off'}">★</span>`).join('')}</div>
<p class="hint">Ходов: ${moves} · лучший результат: ${BEST[li]}</p>
<div class="bar"><button id="again">Ещё раз</button>${last?'<button class="primary" id="lv">Уровни</button>':'<button class="primary" id="next">Дальше</button>'}</div>`;
document.getElementById('ov').hidden=false;
document.getElementById('again').onclick=()=>load(li);
if(last)document.getElementById('lv').onclick=levelMenu;else document.getElementById('next').onclick=()=>load(li+1)}
function levelMenu(){const unlocked=i=>i===0||save[i-1];
document.getElementById('card').innerHTML=`<h2>Уровни</h2><div class="grid">${LEVELS.map((_,i)=>`<button data-i="${i}" class="${save[i]?'done':''}" ${unlocked(i)?'':'disabled'}><span>${i+1}</span><span class="mini">${[0,1,2].map(k=>`<span class="${k<(save[i]||0)?'':'off'}">★</span>`).join('')}</span></button>`).join('')}</div><button id="cl">Закрыть</button>`;
document.getElementById('ov').hidden=false;document.querySelectorAll('.grid button').forEach(b=>b.onclick=()=>load(+b.dataset.i));
document.getElementById('cl').onclick=()=>document.getElementById('ov').hidden=true}

// ---- sizing & textures ----
let T,W,H,dpr,bg;
function fit(){const st=cv.parentElement,cols=grid[0].length,rows=grid.length;
T=Math.floor(Math.min(st.clientWidth/cols,st.clientHeight/rows));dpr=Math.min(devicePixelRatio||1,3);
W=cols*T;H=rows*T;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px'}
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}
function bake(){bg=document.createElement('canvas');bg.width=W*dpr;bg.height=H*dpr;const g=bg.getContext('2d');g.scale(dpr,dpr);const r=rnd(li*97+13);
grid.forEach((row,y)=>[...row].forEach((c,x)=>{const X=x*T,Y=y*T;
if(c==='#'){ // snowy fir on a snow mound
 g.fillStyle='#e9f4fb';g.fillRect(X,Y,T,T);g.fillStyle='#d3e6f2';g.beginPath();g.ellipse(X+T/2,Y+T*.9,T*.48,T*.16,0,0,7);g.fill();
 const sx=X+T*(.5+(r()-.5)*.12),h=T*(.82+r()*.12),top=Y+T*.92-h;
 g.fillStyle='#6b4a3a';g.fillRect(sx-T*.05,Y+T*.78,T*.1,T*.12);
 for(let k=0;k<3;k++){const ty=top+h*k*.24,bw=T*(.2+k*.11),by=ty+h*.36;
  const gr=g.createLinearGradient(sx-bw,0,sx+bw,0);gr.addColorStop(0,'#2f7a5a');gr.addColorStop(1,'#1c5a44');g.fillStyle=gr;
  g.beginPath();g.moveTo(sx,ty);g.quadraticCurveTo(sx-bw*.3,ty+h*.2,sx-bw,by);g.quadraticCurveTo(sx,by+T*.05,sx+bw,by);g.quadraticCurveTo(sx+bw*.3,ty+h*.2,sx,ty);g.fill();
  g.fillStyle='#ffffff';g.beginPath();g.moveTo(sx,ty+T*.01);g.quadraticCurveTo(sx-bw*.25,ty+h*.12,sx-bw*.55,ty+h*.2);g.quadraticCurveTo(sx,ty+h*.15,sx+bw*.5,ty+h*.19);g.quadraticCurveTo(sx+bw*.2,ty+h*.1,sx,ty+T*.01);g.fill();
  g.beginPath();g.ellipse(sx-bw*.5,by-T*.01,bw*.32,T*.035,0,0,7);g.ellipse(sx+bw*.45,by-T*.01,bw*.3,T*.03,0,0,7);g.fill()}
 return}
 // ice base
 const gr=g.createLinearGradient(X,Y,X+T,Y+T);gr.addColorStop(0,'#e4f5fd');gr.addColorStop(1,'#a9d6ee');g.fillStyle=gr;g.fillRect(X,Y,T,T);
 g.strokeStyle='#ffffff55';g.lineWidth=1;g.strokeRect(X+.5,Y+.5,T-1,T-1);

function hintDraw(now){if(!hintFx)return;const k=(now-hintFx.t)/1800;if(k>1){hintFx=null;return}const [dx,dy]=D[hintFx.d];ctx.save();ctx.translate(W/2+dx*Math.sin(k*12)*T*.3,H/2+dy*Math.sin(k*12)*T*.3);ctx.rotate(RANG[hintFx.d]);
 ctx.globalAlpha=Math.sin(k*Math.PI);ctx.fillStyle='#ffd166';ctx.strokeStyle='#7a4b00';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(T*1.3,0);ctx.lineTo(T*.2,-T*.9);ctx.lineTo(T*.2,-T*.4);ctx.lineTo(-T*1,-T*.4);ctx.lineTo(-T*1,T*.4);ctx.lineTo(T*.2,T*.4);ctx.lineTo(T*.2,T*.9);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
addEventListener('resize',()=>{fit();bake();skyFit()});skyFit();

load(start);requestAnimationFrame(frame);
